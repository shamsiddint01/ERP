# Render Blueprint (free plan): Postgres + Key Value (Redis) + NestJS API (Docker) + static SPA.
# Frontend and API share one origin: the static site rewrites /api/* to the API service,
# so the refresh cookie (path /api/v1/auth, SameSite=Lax) and CORS need no extra setup.
# Free Postgres on Render expires 30 days after creation, and the API sleeps after 15 min idle.
databases:
  - name: erp-db
    plan: free
    region: frankfurt
    databaseName: erp_db
    user: erp
    postgresMajorVersion: '16'

services:
  - type: keyvalue
    name: erp-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal connections only

  - type: web
    name: erp-edu-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Apply pending migrations, then start. The runtime image keeps the Prisma CLI (see backend/Dockerfile).
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/main"
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      # main.ts accepts a hop count or "true"; Render's proxy chain length is not fixed.
      - key: TRUST_PROXY
        value: 'true'
      - key: CORS_ORIGIN
        value: https://erp-edu-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: erp-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: erp-redis
          property: port
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true

  - type: web
    name: erp-edu-web
    runtime: static
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://erp-edu-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
